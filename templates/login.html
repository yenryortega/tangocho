<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>単語帳 · Entrar</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="theme-color" content="#1d2f5e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#eef0f5,#0d1220);--band:light-dark(#1d2f5e,#141f3d);--card:light-dark(#fff,#1a2238);--ink:light-dark(#151b2b,#e8ecf5);--muted:light-dark(#566079,#a3adc4);--line:light-dark(#d5dae6,#2c3652);--shu:light-dark(#d9442b,#ff7a5c)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--band);font:16px/1.6 "Noto Sans JP",system-ui,sans-serif;color:var(--ink);padding:24px}
form{background:var(--card);border-radius:16px;padding:32px 28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
h1{margin:0;font:700 34px/1.1 "Zen Kaku Gothic New",sans-serif}
p{margin:0;color:var(--muted);font-size:15px}
input{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
button{min-height:48px;border-radius:10px;border:0;background:var(--band);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.err{color:var(--shu);font-weight:500}
</style>
</head>
<body>
<form method="post">
  <h1>単語帳</h1>
  {% if setup %}<p>Primera vez: crea la contraseña para entrar en tu 単語帳.</p>{% else %}<p>JLPT N1 · vocabulario, gramática y tips de tus clases</p>{% endif %}
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  {% if setup %}
  <input type="password" name="password" placeholder="Nueva contraseña (mín. 8)" aria-label="Nueva contraseña" autocomplete="new-password" minlength="8" required autofocus>
  <input type="password" name="password2" placeholder="Repite la contraseña" aria-label="Repite la contraseña" autocomplete="new-password" required>
  <button type="submit">Crear contraseña y entrar</button>
  {% else %}
  <input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required autofocus>
  <button type="submit">Entrar</button>
  {% endif %}
</form>
</body>
</html>
